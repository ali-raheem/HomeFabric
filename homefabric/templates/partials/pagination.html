{% load fabric %}{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination{% if label %} for {{ label }}{% endif %}">
  {% if page.has_previous %}<a href="?{% page_query page.previous_page_number param %}" rel="prev">← Previous</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }} total)</span>
  {% if page.has_next %}<a href="?{% page_query page.next_page_number param %}" rel="next">Next →</a>{% endif %}
</nav>{% endif %}
