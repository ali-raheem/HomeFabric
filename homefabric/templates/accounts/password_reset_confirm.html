{% extends "base.html" %}{% block title %}Choose a new password{% endblock %}
{% block content %}
{% if validlink %}<h1>Choose a new password</h1>
<form method="post" class="stack">{% csrf_token %}{{ form }}<div class="form-actions"><button type="submit">Set password</button></div></form>
{% else %}<h1>Link not valid</h1><p>This password link is invalid or has already been used. Request a new one.</p>{% endif %}
{% endblock %}
